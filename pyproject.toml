[project]
name = "ouriprata"
version = "0.1.0"
description = ""
authors = [{ name = "23Edu4rd0", email = "eduardo.vchaves23@gmail.com" }]
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "django-jazzmin (>=3.0.5,<4.0.0)",
    "django-tailwind (>=4.5.0,<5.0.0)",
    "django-browser-reload (>=1.21.0,<2.0.0)",
    # Está no INSTALLED_APPS (o admin usa para escolher a cor das peças), mas
    # só existia no venv local e no requirements.txt. Sem a declaração aqui o
    # build instala tudo menos ela e o django.setup() falha com
    # "No module named 'colorfield'" já no collectstatic.
    "django-colorfield (>=0.14.0,<1.0.0)",
    # Produção. Estavam instaladas no venv local mas não declaradas aqui, então
    # o deploy subia sem elas — o whitenoise, por exemplo, está no MIDDLEWARE e
    # derrubaria a aplicação no primeiro request.
    "gunicorn (>=23.0.0,<24.0.0)",
    "whitenoise (>=6.9.0,<7.0.0)",
    "dj-database-url (>=3.0.1,<4.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    # settings.py faz "from dotenv import load_dotenv" logo no topo: sem isto o
    # processo nem chega a subir.
    "python-dotenv (>=1.1.1,<2.0.0)",
]


# Este projeto é uma aplicação Django, não uma biblioteca: não existe um
# módulo "ouriprata" para empacotar (os apps são catalogo, accounts, config e
# theme). Sem isto o uv tenta construir um wheel do projeto e o poetry-core
# falha com "No file/folder found for package ouriprata".
[tool.uv]
package = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["taskipy (>=1.14.1,<2.0.0)", "ruff (>=0.15.20,<0.16.0)"]

[tool.taskipy.tasks]
run = 'python manage.py runserver'
migrate = 'python manage.py migrate'
migrations = 'python manage.py makemigrations'
test = 'python manage.py test'

style = 'python manage.py tailwind start'
build = 'python manage.py tailwind build'

lint = 'ruff lint .'
format = 'ruff format .'
pos_format = 'ruff check . --fix'

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']


[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'
