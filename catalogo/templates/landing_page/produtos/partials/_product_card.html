<div class="product-item flex flex-col h-full bg-white rounded-2xl shadow-sm border border-cream-200 overflow-hidden group hover:shadow-soft hover:-translate-y-1 transition-all duration-300"
     data-price="{% if product.preco %}{{ product.preco|floatformat:2 }}{% else %}0{% endif %}"
     data-promotion="{% if product.em_promocao %}true{% else %}false{% endif %}"
     data-rating="{% if product.avaliacao %}{{ product.avaliacao }}{% else %}0{% endif %}">
  
  <!-- Imagem -->
  <div class="relative w-full h-[220px] overflow-hidden bg-cream-50 flex items-center justify-center shrink-0">
    {% if product.imagem %}
      <img src="{{ product.imagem.url }}" alt="{{ product.nome }}" loading="lazy" 
           class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 bg-white">
    {% else %}
      <!-- Placeholder em caso de ausência de imagem -->
      <i class="bi bi-gem text-4xl text-cream-300"></i>
    {% endif %}
  </div>

  <!-- Corpo do Card -->
  <div class="flex flex-col flex-grow p-4 lg:p-5 text-center">
    <h3 class="text-ink font-medium text-[15px] leading-snug mb-2 line-clamp-2">
      {{ product.nome }}
    </h3>
    
    <div class="mb-4 mt-auto">
      {% if product.preco %}
        <span class="text-ink-muted font-medium text-sm">R$ {{ product.preco }}</span>
      {% else %}
        <span class="text-ink-light text-xs italic">Consulte valor</span>
      {% endif %}
    </div>
    
    <a href="{% url 'product_detail' product.slug %}" 
       class="w-full inline-block px-4 py-2.5 rounded-full border border-gold-400 text-gold-500 text-xs font-semibold uppercase tracking-widest hover:bg-gold-50 hover:text-gold-600 transition-colors mt-auto">
      Ver Detalhes
    </a>
  </div>
</div>
