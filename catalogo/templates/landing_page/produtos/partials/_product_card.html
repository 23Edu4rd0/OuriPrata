<!-- Card de produto/joia -->
<div class="col-6 col-md-4 col-xl-3 product-item"
     data-price="{% if product.preco %}{{ product.preco|floatformat:2 }}{% else %}0{% endif %}">
  <div class="card border-0 h-100 product-card rounded-3 shadow-sm" style="transition: all 0.3s ease;">
    <div class="position-relative overflow-hidden">
      {% if product.imagem %}
        <img src="{{ product.imagem.url }}" class="card-img-top rounded-top-3" alt="{{ product.nome }}" style="height: 220px; object-fit: cover; background: #fff;">
      {% else %}
        <div class="card-img-top bg-light d-flex align-items-center justify-content-center rounded-top-3" style="height: 220px;">
          <i class="bi bi-gem text-muted" style="font-size: 2.5rem;"></i>
        </div>
      {% endif %}
    </div>
    <div class="card-body d-flex flex-column p-3 text-center">
      <h5 class="card-title mb-2 text-dark font-montserrat fw-semibold" style="font-size: 0.95rem; line-height: 1.3;">{{ product.nome }}</h5>
      
      <div class="mb-3">
        {% if product.preco %}
          <span class="fw-bold text-secondary" style="font-size: 0.95rem;">R$ {{ product.preco }}</span>
        {% else %}
          <span class="text-muted small" style="font-size: 0.85rem; font-style: italic;">Consulte valor</span>
        {% endif %}
      </div>
      
      <a href="{% url 'product_detail' product.slug %}" class="btn btn-outline-warning btn-sm rounded-pill w-100 mt-auto fw-semibold" style="font-size: 0.75rem; letter-spacing: 0.5px;">
        Ver Detalhes
      </a>
    </div>
  </div>
</div>

<style>
  .product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08) !important;
  }
</style>
