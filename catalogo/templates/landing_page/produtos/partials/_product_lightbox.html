<div id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizar imagem"
  class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 cursor-zoom-out">
  <button id="lightboxClose" aria-label="Fechar"
    class="absolute top-4 right-5 text-white/60 hover:text-white text-4xl leading-none font-light">&times;</button>
  <button id="lightboxPrev" aria-label="Anterior"
    class="absolute left-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white text-5xl leading-none font-thin hidden">&#8249;</button>
  <button id="lightboxNext" aria-label="Próxima"
    class="absolute right-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white text-5xl leading-none font-thin hidden">&#8250;</button>
  <img id="lightboxImg" src="" alt=""
    class="max-h-[90vh] max-w-[90vw] object-contain select-none cursor-default">
</div>
