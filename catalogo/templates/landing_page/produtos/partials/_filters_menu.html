{% for cat in all_categories %}
<a href="{% url 'products_by_category' cat.slug %}"
  class="category-btn w-full flex items-center justify-between px-4 py-2.5 rounded-full border text-sm transition-all
   {% if cat == category %} border-gold-400 bg-gold-50 text-ink font-medium shadow-sm {% else %} border-cream-200 text-ink-muted hover:border-gold-300 hover:text-ink {% endif %}">
  <span>{{ cat.name }}</span>
  {% if cat == category %}
  <i class="bi bi-check-circle-fill text-gold-500"></i>
  {% endif %}
</a>
{% endfor %}

<script>
  function parsePrice(val) {
    if (!val) return 0;
    // Aceita vírgula ou ponto
    return parseFloat(val.replace(',', '.')) || 0;
  }

  function applyFilters() {
    console.log('applyFilters called');
    const checkbox = document.getElementById('promocao');
    const minPrice = parsePrice(document.getElementById('preco-min').value);
    const maxPrice = parsePrice(document.getElementById('preco-max').value) || Infinity;
    const ratingFilter = document.querySelector('.rating-filter-btn.active')?.dataset.rating || 'all';
    const products = document.querySelectorAll('.product-item');

    // Verificar se os produtos têm os atributos corretos
    products.forEach(product => {
      const isPromotion = product.dataset.promotion === 'true';
      const price = parsePrice(product.dataset.price);
      const rating = parseFloat(product.dataset.rating) || 0;

      let show = true;

      // Filtro de promoção
      if (checkbox.checked && !isPromotion) show = false;

      // Filtro de preço
      if (price < minPrice || price > maxPrice) show = false;

      // Filtro de avaliação
      if (ratingFilter !== 'all') {
        const minRating = parseInt(ratingFilter);
        if (rating < minRating) show = false;
      }

      product.style.display = show ? 'block' : 'none';
    });

    console.log('Filters applied');
  }

  // Configurar filtros de avaliação
  document.querySelectorAll('.rating-filter-btn').forEach(btn => {
    btn.addEventListener('click', function () {
      // Remover classe active de todos os botões
      document.querySelectorAll('.rating-filter-btn').forEach(b => b.classList.remove('active'));
      // Adicionar classe active ao botão clicado
      this.classList.add('active');
      // Aplicar filtros
      applyFilters();
    });
  });

  // Função para filtrar por promoção e atualizar URL
  function filterByPromotion() {
    const checkbox = document.getElementById('promocao');
    const currentUrl = new URL(window.location);

    if (checkbox.checked) {
      currentUrl.searchParams.set('promocoes', 'true');
    } else {
      currentUrl.searchParams.delete('promocoes');
    }

    // Aplicar filtro local
    applyFilters();

    // Atualizar URL sem recarregar a página
    window.history.pushState({}, '', currentUrl);
  }

  // Configurar event listeners quando o DOM estiver pronto
  document.addEventListener('DOMContentLoaded', function () {
    const precoMin = document.getElementById('preco-min');
    const precoMax = document.getElementById('preco-max');
    const applyButton = document.querySelector('button[onclick="applyFilters()"]');

    if (precoMin) {
      precoMin.addEventListener('input', applyFilters);
    }
    if (precoMax) {
      precoMax.addEventListener('input', applyFilters);
    }
    if (applyButton) {
      applyButton.addEventListener('click', applyFilters);
    }

    // Configurar checkbox de promoção
    const promoCheckbox = document.getElementById('promocao');
    if (promoCheckbox) {
      promoCheckbox.addEventListener('change', filterByPromotion);
    }
  });
</script>
