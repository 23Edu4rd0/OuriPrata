      <div class="lg:col-span-7">
        <div class="flex gap-4">

          {% if product.image %}
          <div class="flex flex-col gap-3 shrink-0" id="thumbsContainer">
            <button class="product-gallery__thumb border-2 border-ink rounded-lg overflow-hidden w-16 h-16 shrink-0 bg-stone-50 transition-colors"
              data-src="{{ product.image.url }}">
              <img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy"
                class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity">
            </button>
            {% for extra in product.extra_images %}
            <button class="product-gallery__thumb border-2 border-transparent rounded-lg overflow-hidden w-16 h-16 shrink-0 bg-stone-50 transition-colors"
              data-src="{{ extra.image.url }}">
              <img src="{{ extra.image.url }}" alt="{{ product.name }} — foto {{ forloop.counter|add:1 }}" loading="lazy"
                class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity">
            </button>
            {% endfor %}
          </div>
          {% endif %}

          <div class="bg-stone-50 rounded-2xl aspect-[4/5] w-full max-h-[560px] relative overflow-hidden" id="zoomContainer">
            {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" id="mainImg"
              class="w-full h-full object-contain transition-transform duration-300 ease-out cursor-zoom-in">
            {% else %}
            <div class="w-full h-full flex flex-col items-center justify-center gap-3 text-ink/25">
              <i class="bi bi-gem text-3xl" aria-hidden="true"></i>
              <span class="text-[10px] uppercase tracking-[0.2em]">Sem imagem</span>
            </div>
            {% endif %}

            <button type="button" data-wishlist-toggle data-slug="{{ product.slug }}" data-name="{{ product.name }}"
              data-image="{% if product.image %}{{ product.image.url }}{% endif %}"
              data-price="{% if product.current_price %}{{ product.current_price|floatformat:2 }}{% endif %}"
              data-url="{% url 'product_detail' product.slug %}"
              aria-label="Adicionar aos favoritos"
              class="wishlist-btn absolute top-4 right-4 w-10 h-10 flex items-center justify-center rounded-full bg-white/90 backdrop-blur-sm text-ink/60 shadow-soft hover:text-gold-500 transition-colors [&.is-active]:text-gold-500 z-10">
              <i class="bi bi-heart text-base" aria-hidden="true"></i>
            </button>
          </div>

        </div>
      </div>
