{% load static %}
<section class="relative w-full h-[70vh] md:h-[80vh] overflow-hidden" id="heroCarousel">

  <!-- Slide 1 -->
  <div class="carousel-slide absolute inset-0 transition-opacity duration-700 ease-in-out opacity-100" data-index="0">
    <img src="{% static 'assets/landing_page/carousel-braceletes.jpg' %}" alt="Braceletes"
         class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-black/25"></div>
    <div class="absolute inset-0 flex items-center">
      <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 w-full">
        <div class="max-w-md">
          <p class="font-serif italic text-lg text-white/80 mb-2">descubra</p>
          <h2 class="font-serif text-5xl md:text-6xl text-white font-medium mb-6 leading-tight">Braceletes</h2>
          <a href="{% url 'products_by_category' 'pulseiras' %}"
             class="inline-block bg-gold-400 hover:bg-gold-500 text-white text-xs tracking-[0.2em] uppercase px-8 py-4 rounded-full transition-colors duration-200">
            Conhecer
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Slide 2 -->
  <div class="carousel-slide absolute inset-0 transition-opacity duration-700 ease-in-out opacity-0" data-index="1">
    <img src="{% static 'assets/landing_page/carousel-aneis.jpg' %}" alt="Anéis"
         class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-black/25"></div>
    <div class="absolute inset-0 flex items-center">
      <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 w-full">
        <div class="max-w-md">
          <p class="font-serif italic text-lg text-white/80 mb-2">descubra</p>
          <h2 class="font-serif text-5xl md:text-6xl text-white font-medium mb-6 leading-tight">Anéis</h2>
          <a href="{% url 'products_by_category' 'aneis' %}"
             class="inline-block bg-gold-400 hover:bg-gold-500 text-white text-xs tracking-[0.2em] uppercase px-8 py-4 rounded-full transition-colors duration-200">
            Conhecer
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Slide 3 -->
  <div class="carousel-slide absolute inset-0 transition-opacity duration-700 ease-in-out opacity-0" data-index="2">
    <img src="{% static 'assets/landing_page/carousel-colares.jpg' %}" alt="Colares"
         class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-black/25"></div>
    <div class="absolute inset-0 flex items-center">
      <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 w-full">
        <div class="max-w-md">
          <p class="font-serif italic text-lg text-white/80 mb-2">descubra</p>
          <h2 class="font-serif text-5xl md:text-6xl text-white font-medium mb-6 leading-tight">Colares</h2>
          <a href="{% url 'products_by_category' 'colares' %}"
             class="inline-block bg-gold-400 hover:bg-gold-500 text-white text-xs tracking-[0.2em] uppercase px-8 py-4 rounded-full transition-colors duration-200">
            Conhecer
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Setas -->
  <button id="carouselPrev" aria-label="Slide anterior"
    class="absolute left-3 md:left-6 top-1/2 -translate-y-1/2 z-10 w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-white/80 hover:text-white transition-colors duration-200">
    <i class="bi bi-chevron-left text-2xl md:text-3xl"></i>
  </button>
  <button id="carouselNext" aria-label="Próximo slide"
    class="absolute right-3 md:right-6 top-1/2 -translate-y-1/2 z-10 w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-white/80 hover:text-white transition-colors duration-200">
    <i class="bi bi-chevron-right text-2xl md:text-3xl"></i>
  </button>

  <!-- Dots -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex gap-2" id="carouselDots">
    <button class="carousel-dot w-2 h-2 rounded-full bg-white transition-all duration-300" data-index="0" aria-label="Ir para slide 1"></button>
    <button class="carousel-dot w-2 h-2 rounded-full bg-white/40 transition-all duration-300" data-index="1" aria-label="Ir para slide 2"></button>
    <button class="carousel-dot w-2 h-2 rounded-full bg-white/40 transition-all duration-300" data-index="2" aria-label="Ir para slide 3"></button>
  </div>
</section>
