{% load static %}
<header>
  <nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm py-3">
    <div class="container">
      <a href="{% url 'home' %}" class="navbar-brand text-decoration-none">
        <h3 class="mb-0 fw-bold font-montserrat" style="font-size: 1.5rem; letter-spacing: 1px;">
          <span class="text-warning">Ouri</span><span class="text-secondary">Prata</span>
        </h3>
      </a>
      
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#portfolioNavbar" aria-controls="portfolioNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="portfolioNavbar">
        <ul class="navbar-nav mx-auto mb-2 mb-md-0 gap-2 gap-lg-4">
          <li class="nav-item">
            <a class="nav-link fw-semibold {% if request.resolver_match.url_name == 'home' %}active text-warning{% endif %}" href="{% url 'home' %}">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold {% if request.resolver_match.url_name == 'catalogo' or request.resolver_match.url_name == 'product_detail' or request.resolver_match.url_name == 'products_by_category' %}active text-warning{% endif %}" href="{% url 'catalogo' %}">Joias</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold {% if request.resolver_match.url_name == 'about' %}active text-warning{% endif %}" href="{% url 'about' %}">Quem Somos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold {% if request.resolver_match.url_name == 'contact' %}active text-warning{% endif %}" href="{% url 'contact' %}">Contato</a>
          </li>
        </ul>
        
        <form class="d-flex position-relative ms-auto" method="get" action="{% url 'search_products' %}" style="max-width: 250px; width: 100%;">
          <div class="input-group">
            <input
              type="text"
              name="q"
              placeholder="Buscar joias..."
              class="form-control border-0 bg-light rounded-pill ps-3 pe-4"
              id="search-input"
              autocomplete="off"
              value="{{ request.GET.q|default:'' }}"
              style="font-size: 0.9rem;"
            />
            <button type="submit" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-muted p-0 pe-3" style="z-index: 5;">
              <i class="bi bi-search"></i>
            </button>
          </div>
          
          <div id="search-suggestions" class="position-absolute w-100 bg-white shadow rounded-3 mt-5 d-none" style="z-index: 1050; max-height: 300px; overflow-y: auto; top: 0;">
            <div id="suggestions-list"></div>
          </div>
        </form>
      </div>
    </div>
  </nav>
</header>
