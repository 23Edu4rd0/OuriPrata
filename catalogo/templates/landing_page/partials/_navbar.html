{% load static %}
<nav class="op-nav" id="opNav" role="navigation" aria-label="Navegação principal">
  <div class="op-nav__inner">

    <!-- Logo -->
    <a href="{% url 'home' %}" class="op-nav__logo" aria-label="OuriPrata - Página inicial">
      <span class="op-nav__logo-ouri">Ouri</span><span class="op-nav__logo-prata">Prata</span>
    </a>

    <!-- Links desktop -->
    <ul class="op-nav__links" role="list">
      <li>
        <a href="{% url 'home' %}" class="op-nav__link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
          Início
        </a>
      </li>
      <li>
        <a href="{% url 'all_products' %}" class="op-nav__link {% if 'products' in request.path %}active{% endif %}">
          Coleção
        </a>
      </li>
      <li>
        <a href="{% url 'about_us' %}" class="op-nav__link {% if 'sobre' in request.path %}active{% endif %}">
          Sobre
        </a>
      </li>
      <li>
        <a href="{% url 'contact_us' %}" class="op-nav__link {% if 'contato' in request.path %}active{% endif %}">
          Contato
        </a>
      </li>
    </ul>

    <!-- Ações -->
    <div class="op-nav__actions">
      <!-- Busca inline -->
      <div class="search-wrap" style="max-width:240px;" role="search">
        <i class="bi bi-search search-icon" aria-hidden="true"></i>
        <input
          type="search"
          id="navSearch"
          class="search-input"
          placeholder="Buscar joias..."
          autocomplete="off"
          aria-label="Buscar joias"
        >
        <div class="search-suggestions" id="searchSuggestions" role="listbox"></div>
      </div>
    </div>

    <!-- Toggle mobile -->
    <button class="op-nav__toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="navDrawer">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</nav>

<!-- Drawer Mobile -->
<div class="op-nav__drawer" id="navDrawer" role="dialog" aria-label="Menu de navegação" aria-modal="true">
  <div class="op-nav__drawer-backdrop" id="drawerBackdrop"></div>
  <div class="op-nav__drawer-panel">
    <p class="op-nav__drawer-logo">
      <span>Ouri</span>Prata
    </p>
    <a href="{% url 'home' %}"         class="op-nav__drawer-link">Início</a>
    <a href="{% url 'all_products' %}" class="op-nav__drawer-link">Coleção</a>
    <a href="{% url 'about_us' %}"     class="op-nav__drawer-link">Sobre</a>
    <a href="{% url 'contact_us' %}"   class="op-nav__drawer-link">Contato</a>

    <div style="margin-top: 24px;">
      <div class="search-wrap" style="max-width:100%;">
        <i class="bi bi-search search-icon" aria-hidden="true"></i>
        <input type="search" class="search-input" placeholder="Buscar joias..." aria-label="Buscar no mobile">
      </div>
    </div>

    <div style="margin-top: auto; padding-top: 32px; border-top: 1px solid var(--gray-100);">
      <p style="font-size:12px; color: var(--gray-400); line-height:1.6; margin:0;">
        Joias em ouro e prata, feitas com amor e cuidado para cada momento especial.
      </p>
    </div>
  </div>
</div>
