{% load static %}

<section class="py-10 md:py-16 bg-white">
  <div class="max-w-7xl mx-auto px-6 lg:px-12">

    <div class="text-center mb-6 md:mb-10">
      <h2 class="font-serif text-3xl md:text-4xl text-ink font-light tracking-wide mb-5">Lançamentos</h2>
      <div class="flex items-center justify-center gap-4">
        <span class="h-px w-20 bg-gold-300/60"></span>
      </div>
    </div>

    {% if new_arrivals %}
      {% include 'landing_page/partials/_product_carousel.html' with products=new_arrivals %}
    {% else %}
      <p class="text-center text-ink/40 font-light text-sm py-12">Nenhum lançamento no momento.</p>
    {% endif %}

    <div class="text-center mt-10">
      <a href="{% url 'all_products' %}"
        class="inline-flex items-center gap-3 text-[10px] uppercase tracking-[0.25em] text-ink/50 hover:text-gold-500 transition-colors duration-300 border-b border-ink/15 hover:border-gold-400 pb-1.5">
        Ver toda a coleção
        <i class="bi bi-arrow-right text-xs" aria-hidden="true"></i>
      </a>
    </div>

  </div>
</section>
