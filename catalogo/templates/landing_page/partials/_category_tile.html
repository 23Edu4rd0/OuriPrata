{% load static %}
<a href="{% url 'products_by_category' slug %}" class="group block">
  <div class="aspect-square overflow-hidden rounded-xl bg-stone-100 mb-3 ring-1 ring-ink/5 group-hover:ring-gold-300/60 transition-all duration-500">
    <img src="{% static imagem %}" alt="{{ nome }}" loading="lazy"
         class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105">
  </div>
  <p class="text-center text-[11px] tracking-[0.2em] uppercase text-ink/60 group-hover:text-gold-500 transition-colors duration-300">
    {{ nome }}
  </p>
</a>
