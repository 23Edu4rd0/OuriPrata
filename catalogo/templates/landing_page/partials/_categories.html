{% load static %}
<section class="py-10 md:py-16 bg-white">
  <div class="max-w-7xl mx-auto px-6 lg:px-12">

    <div class="text-center mb-8 md:mb-12">
      <p class="font-serif italic text-[11px] tracking-[0.35em] text-gold-400 uppercase mb-3">Explore</p>
      <h2 class="font-serif text-3xl md:text-4xl text-ink font-light tracking-wide mb-5">Compre por Categoria</h2>
      <div class="flex items-center justify-center gap-4">
        <span class="h-px w-10 bg-gold-300/60"></span>
        <span class="text-gold-400/70 text-[7px]">◆</span>
        <span class="h-px w-10 bg-gold-300/60"></span>
      </div>
    </div>

    <div class="flex md:grid md:grid-cols-5 gap-5 md:gap-8
                overflow-x-auto md:overflow-visible
                snap-x snap-mandatory md:snap-none
                [-ms-overflow-style:none] [scrollbar-width:none]
                [&::-webkit-scrollbar]:hidden">

      <a href="{% url 'products_by_category' 'aneis' %}"
         class="group shrink-0 w-[72%] xs:w-[56%] sm:w-[40%] md:w-auto snap-center">
        <div class="aspect-square overflow-hidden rounded-xl bg-stone-100 mb-4 ring-1 ring-ink/5 group-hover:ring-gold-300/60 transition-all duration-500">
          <img src="{% static 'assets/landing_page/cat-aneis.png' %}" alt="Anéis"
               class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105">
        </div>
        <p class="text-center text-[11px] tracking-[0.2em] uppercase text-ink/60 group-hover:text-gold-500 transition-colors duration-300">
          Anéis
        </p>
        <div class="flex justify-center mt-2">
          <span class="h-px w-0 bg-gold-400 group-hover:w-6 transition-all duration-400 ease-out"></span>
        </div>
      </a>
