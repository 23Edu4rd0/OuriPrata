{% comment %} Partial de filtros do catálogo — filtro por categoria e faixa de preço {% endcomment %}
<div class="bg-white rounded-2xl shadow-sm border border-cream-200 p-5 lg:p-6 mb-6">

  <div class="mb-6 text-center">
    <span class="text-ink font-serif text-xl font-medium tracking-wide flex items-center justify-center gap-2">
      <i class="bi bi-funnel"></i> Filtros
    </span>
  </div>

  <div>
    <!-- Filtro por Categoria -->
    <div class="mb-6">
      <div class="text-ink font-medium mb-3 flex items-center gap-2 text-sm uppercase tracking-wider">
        <i class="bi bi-grid text-gold-500"></i> Categorias
      </div>
      <div class="flex flex-col gap-2">
        <a href="{% url 'all_products' %}"
           class="w-full flex items-center justify-between px-4 py-2.5 rounded-full border border-cream-200 text-ink-muted text-sm transition-all hover:border-gold-300 hover:text-ink">
          <span class="flex items-center gap-2"><i class="bi bi-grid-3x3-gap"></i> Todas</span>
        </a>

        {% for cat in all_categories %}
        <a href="{% url 'products_by_category' cat.slug %}"
           class="w-full flex items-center justify-between px-4 py-2.5 rounded-full border text-sm transition-all
           {% if current_category and cat.slug == current_category.slug %} border-gold-400 bg-gold-50 text-ink font-medium shadow-sm {% else %} border-cream-200 text-ink-muted hover:border-gold-300 hover:text-ink {% endif %}">
          <span>{{ cat.name }}</span>
          {% if current_category and cat.slug == current_category.slug %}
            <i class="bi bi-check-circle-fill text-gold-500"></i>
          {% endif %}
        </a>
        {% endfor %}
      </div>
    </div>

    <hr class="border-cream-200 my-6">

    <!-- Filtro por Preço -->
    <div class="mb-4">
      <div class="text-ink font-medium mb-3 flex items-center gap-2 text-sm uppercase tracking-wider">
        <i class="bi bi-currency-dollar text-gold-500"></i> Faixa de Preço
      </div>
      <div class="flex gap-2 mb-4">
        <input type="number" id="preco-min" class="w-1/2 bg-cream-50 border border-cream-200 rounded-lg px-3 py-2 text-sm text-ink placeholder-ink-light focus:outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400 transition-all" placeholder="Mínimo">
        <input type="number" id="preco-max" class="w-1/2 bg-cream-50 border border-cream-200 rounded-lg px-3 py-2 text-sm text-ink placeholder-ink-light focus:outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400 transition-all" placeholder="Máximo">
      </div>
      <button type="button" onclick="applyLocalFilters()" class="w-full bg-ink hover:bg-gold-500 text-white rounded-full px-4 py-2.5 text-sm font-medium transition-colors">
        Aplicar Filtros
      </button>
    </div>
  </div>
</div>

<script>
  function parsePrice(val) {
    if (!val) return 0;
    return parseFloat(val.replace(',', '.')) || 0;
  }

  function applyLocalFilters() {
    const minPrice = parsePrice(document.getElementById('preco-min').value);
    const maxPrice = parsePrice(document.getElementById('preco-max').value) || Infinity;
    const products = document.querySelectorAll('.product-item');
    let visibleCount = 0;

    products.forEach(product => {
      const price = parsePrice(product.dataset.price);
      const show = price >= minPrice && price <= maxPrice;
      product.style.display = show ? '' : 'none';
      if (show) visibleCount++;
    });

    const emptyMsg = document.getElementById('filtersEmptyState');
    if (emptyMsg) emptyMsg.classList.toggle('hidden', visibleCount !== 0);
  }

  document.addEventListener('DOMContentLoaded', function() {
    const precoMin = document.getElementById('preco-min');
    const precoMax = document.getElementById('preco-max');
    if (precoMin) precoMin.addEventListener('input', applyLocalFilters);
    if (precoMax) precoMax.addEventListener('input', applyLocalFilters);
  });
</script>
