{% comment %} Barra de filtro por preço — discreta, acima do grid de produtos {% endcomment %}
<div class="flex flex-wrap items-center justify-between gap-4 mb-10 pb-6 border-b border-ink/5">

  <p class="text-[11px] tracking-[0.15em] uppercase text-ink/40">
    <span id="resultsCount">{{ total_products }}</span> peça{{ total_products|pluralize:"s" }}
  </p>

  <div class="flex items-center gap-3">
    <span class="text-[10px] tracking-[0.2em] uppercase text-ink/40 hidden sm:inline">Preço</span>
    <div class="flex items-center gap-2">
      <input type="number" id="preco-min" placeholder="Mín."
        class="w-20 bg-transparent border-b border-ink/15 px-1 py-1.5 text-sm text-ink placeholder-ink/30 focus:outline-none focus:border-gold-400 transition-colors">
      <span class="text-ink/20">—</span>
      <input type="number" id="preco-max" placeholder="Máx."
        class="w-20 bg-transparent border-b border-ink/15 px-1 py-1.5 text-sm text-ink placeholder-ink/30 focus:outline-none focus:border-gold-400 transition-colors">
    </div>
    <button type="button" onclick="applyLocalFilters()"
      class="text-[10px] tracking-[0.2em] uppercase text-white bg-ink px-5 py-2.5 rounded-full hover:bg-gold-500 transition-colors">
      Aplicar
    </button>
    <button type="button" onclick="clearLocalFilters()"
      class="text-[10px] tracking-[0.2em] uppercase text-ink/40 hover:text-ink transition-colors">
      Limpar
    </button>
  </div>
</div>

<script>
  function parsePrice(val) {
    if (!val) return 0;
    return parseFloat(val.replace(',', '.')) || 0;
  }

  function applyLocalFilters() {
    const minPrice = parsePrice(document.getElementById('preco-min').value);
    const maxPrice = parsePrice(document.getElementById('preco-max').value) || Infinity;
    const products = document.querySelectorAll('.product-item');
    let visibleCount = 0;

    products.forEach(product => {
      const price = parsePrice(product.dataset.price);
      const show = price >= minPrice && price <= maxPrice;
      product.style.display = show ? '' : 'none';
      if (show) visibleCount++;
    });

    const countEl = document.getElementById('resultsCount');
    if (countEl) countEl.textContent = visibleCount;

    const emptyMsg = document.getElementById('filtersEmptyState');
    if (emptyMsg) emptyMsg.classList.toggle('hidden', visibleCount !== 0);
  }

  function clearLocalFilters() {
    document.getElementById('preco-min').value = '';
    document.getElementById('preco-max').value = '';
    applyLocalFilters();
  }

  document.addEventListener('DOMContentLoaded', function() {
    const precoMin = document.getElementById('preco-min');
    const precoMax = document.getElementById('preco-max');
    if (precoMin) precoMin.addEventListener('input', applyLocalFilters);
    if (precoMax) precoMax.addEventListener('input', applyLocalFilters);
  });
</script>
