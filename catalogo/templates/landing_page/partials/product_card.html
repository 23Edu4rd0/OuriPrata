{% load static %}
<article class="flex flex-col h-full bg-white rounded-2xl shadow-sm border border-cream-200 overflow-hidden group hover:shadow-soft hover:-translate-y-1 transition-all duration-300">
  
  <!-- Imagem e Badge -->
  <a href="{{ product.get_absolute_url }}" class="relative w-full aspect-[3/4] overflow-hidden bg-cream-50 block shrink-0" aria-label="{{ product.nome }}">
    {% if product.imagem %}
      <img
        src="{{ product.imagem.url }}"
        alt="{{ product.nome }}"
        loading="lazy"
        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
      >
    {% else %}
      <img
        src="{% static 'assets/landing_page/hero.png' %}"
        alt="{{ product.nome }}"
        loading="lazy"
        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
      >
    {% endif %}
    
    {% if product.destaque %}
      <span class="absolute top-3 left-3 bg-gold-400 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest shadow-sm">
        Destaque
      </span>
    {% endif %}
  </a>

  <!-- Corpo do Card -->
  <div class="flex flex-col flex-grow p-5 text-center">
    {% if product.categoria %}
      <span class="text-[10px] tracking-widest uppercase text-gold-500 font-semibold mb-2 block">
        {{ product.categoria.nome }}
      </span>
    {% endif %}
    
    <h3 class="text-ink font-serif text-lg leading-snug mb-3">
      {{ product.nome }}
    </h3>
    
    {% if product.preco %}
      <p class="text-ink-muted text-sm mt-auto">
        a partir de <strong class="text-ink font-medium">R$ {{ product.preco }}</strong>
      </p>
    {% endif %}
  </div>

  <!-- Call to Action -->
  <a href="{{ product.get_absolute_url }}" class="flex items-center justify-center gap-2 w-full py-3.5 border-t border-cream-200 bg-cream-50/50 text-xs font-semibold uppercase tracking-widest text-ink hover:text-gold-500 hover:bg-cream-100 transition-colors" aria-label="Ver detalhes de {{ product.nome }}">
    Ver peça <i class="bi bi-arrow-right text-sm" aria-hidden="true"></i>
  </a>
  
</article>
