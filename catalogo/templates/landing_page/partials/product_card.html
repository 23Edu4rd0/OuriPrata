{% load static %}
<article class="card-joia">
  <a href="{{ product.get_absolute_url }}" class="card-joia__image" aria-label="{{ product.nome }}">
    {% if product.imagem %}
      <img
        src="{{ product.imagem.url }}"
        alt="{{ product.nome }}"
        loading="lazy"
        width="400"
        height="533"
      >
    {% else %}
      <img
        src="{% static 'assets/landing_page/hero.png' %}"
        alt="{{ product.nome }}"
        loading="lazy"
        width="400"
        height="533"
      >
    {% endif %}
    {% if product.destaque %}
      <span class="card-joia__badge">Destaque</span>
    {% endif %}
  </a>

  <div class="card-joia__body">
    {% if product.categoria %}
      <span class="card-joia__cat">{{ product.categoria.nome }}</span>
    {% endif %}
    <h3 class="card-joia__title">{{ product.nome }}</h3>
    {% if product.preco %}
      <p class="card-joia__price">a partir de <strong>R$ {{ product.preco }}</strong></p>
    {% endif %}
  </div>

  <a href="{{ product.get_absolute_url }}" class="card-joia__cta" aria-label="Ver detalhes de {{ product.nome }}">
    Ver peça <i class="bi bi-arrow-right" aria-hidden="true"></i>
  </a>
</article>
