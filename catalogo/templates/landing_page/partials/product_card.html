{% comment %} Card de produto — usado em grids e listagens {% endcomment %}
<div class="product-item group cursor-pointer border border-cream-200 bg-white rounded-2xl overflow-hidden shadow-soft"
  data-price="{% if product.price %}{{ product.price|floatformat:2 }}{% else %}0{% endif %}"
  data-promotion="{% if product.em_promocao %}true{% else %}false{% endif %}"
  data-rating="{% if product.avaliacao %}{{ product.avaliacao }}{% else %}0{% endif %}">

  <a href="{% url 'product_detail' product.slug %}" class="block">
    <div class="relative w-full aspect-square overflow-hidden bg-stone-50">
      {% if product.image %}
      <img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy"
        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
      {% else %}
      <div class="w-full h-full flex items-center justify-center">
        <i class="bi bi-gem text-2xl text-ink/20"></i>
      </div>
      {% endif %}
    </div>

    <div class="px-4 pt-4 pb-3 text-center">
      <h3 class="font-serif text-[15px] text-ink font-light leading-snug mb-1 truncate">
        {{ product.name }}
      </h3>
      {% if product.price %}
      <span class="text-[13px] text-ink/60 tracking-wider">R$ {{ product.price }}</span>
      {% else %}
      <span class="text-[11px] uppercase tracking-widest text-ink/40">Consulte</span>
      {% endif %}
    </div>

    <div class="flex items-center justify-center gap-2 w-full py-3 border-t border-cream-200 bg-cream-50/50 text-[10px] font-semibold uppercase tracking-widest text-ink group-hover:text-gold-500 transition-colors">
      Ver peça <i class="bi bi-arrow-right text-xs" aria-hidden="true"></i>
    </div>
  </a>
</div>
