<div class="relative group" data-carousel>

  <div data-carousel-track
    class="flex overflow-x-auto overscroll-x-contain
           snap-x snap-mandatory md:snap-proximity
           scroll-smooth motion-reduce:scroll-auto
           -mx-2 md:-mx-3
           [-webkit-overflow-scrolling:touch]
           [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
    {% for product in products %}
    <div class="snap-start shrink-0 w-[43%] md:w-1/4 px-2 md:px-3">
      {% include 'landing_page/partials/product_card.html' with product=product %}
    </div>
    {% endfor %}
  </div>

  <button type="button" data-carousel-prev aria-label="Ver peças anteriores"
    class="hidden md:group-data-[overflow=true]:flex
           absolute left-0 -translate-x-1/2 top-[38%] -translate-y-1/2 z-20
           w-11 h-11 items-center justify-center rounded-full
           bg-white ring-1 ring-ink/8 shadow-[0_4px_20px_rgba(0,0,0,.10)]
           text-ink/70 hover:text-gold-600 hover:ring-gold-300
           active:scale-95 transition-all duration-300
           disabled:opacity-0 disabled:pointer-events-none">
    <i class="bi bi-chevron-left text-base" aria-hidden="true"></i>
  </button>

  <button type="button" data-carousel-next aria-label="Ver mais peças"
    class="hidden md:group-data-[overflow=true]:flex
           absolute right-0 translate-x-1/2 top-[38%] -translate-y-1/2 z-20
           w-11 h-11 items-center justify-center rounded-full
           bg-white ring-1 ring-ink/8 shadow-[0_4px_20px_rgba(0,0,0,.10)]
           text-ink/70 hover:text-gold-600 hover:ring-gold-300
           active:scale-95 transition-all duration-300
           disabled:opacity-0 disabled:pointer-events-none">
    <i class="bi bi-chevron-right text-base" aria-hidden="true"></i>
  </button>

</div>
